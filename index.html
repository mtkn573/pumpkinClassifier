<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pumpkinClassifier</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        
        html,
        body {
            height: 100%;
        }

        .toggle {
            position: relative;
            display: flex;
            width: 166px;
            height: 60px;
            border: 2px solid #ff8800;
            border-radius: 40px;
            box-sizing: border-box;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .toggle input {
            display: none;
        }

        .toggle-circle {
            position: absolute;
            width: 50%;
            height: 100%;
            top: 0;
            left: 0;
            background: #ff941f;
            border-radius: 40px;

            transition: transform 0.4s cubic-bezier(.68, -0.3, .32, 1.3);
        }

        .toggle input:checked~.toggle-circle {
            transform: translateX(100%);
        }

        .option {
            position: relative;
            z-index: 1;
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>

<body>
    <div style="display:flex;flex-direction:column;justify-content:center;align-items:flex-end;height:100%;">
        <div style="height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;">
            <div style="width:100%;height:100%;display:flex;justify-content:center;align-items:center;">
                <img id="pumpkin" style="width:25%;display:none;justify-content:center;align-items:center;"src="pumpkin.png">
            </div>
            <div id="size"style="width:100%;display:flex;justify-content:center;align-items:center;"></div>
            <div style="display:flex;">
                <div class="toggle">
                    <input type="checkbox" id="unitToggle" checked>
                    <div class="toggle-circle"></div>
                    <label for="unitToggle" class="option">
                        pounds
                    </label>
                    <label for="unitToggle" class="option">
                        kilograms
                    </label>
                </div>
                <input id="weightInput" type="number"
                style="border-color:rgba(255,140,0,1);width:100%;height:100%px;" min="1" step="1">
            </div>
        </div>
    </div>
    <script src="pumpkin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/decimal.js@latest/decimal.min.js"></script>
    <script>
        isAndroid=/Android/i.test(navigator.userAgent)
        isIos=/iPad|iPhone|iPod/.test(navigator.platform)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)
        isInKilograms=true
        if(!isAndroid&&!isIos){
            document.body.innerHTML="using app is i guess available on devices with ios or android."
            document.body.style.fontSize="30px"
            document.body.style.display="flex"
            document.body.style.justifyContent="center"
            document.body.style.alignItems="center"
        }else{
            document.getElementById(`weightInput`).addEventListener(`input`,function(){
                if(this.value==""){
                    document.getElementById(`pumpkin`).style.display="none"
                    document.getElementById(`size`).textContent=""
                    return
                }
                weight=parseFloat(this.value)
                if(isInKilograms){
                    weight=Decimal(weight).times(2.205)
                }
                if(weighPumpkin(weight)=="Mini"){
                    document.getElementById(`pumpkin`).style.display="flex"
                    document.getElementById(`pumpkin`).style.width="12%"
                    document.getElementById(`size`).textContent="Mini"
                }
                if(weighPumpkin(weight)=="Carving"){
                    document.getElementById(`pumpkin`).style.display="flex"
                    document.getElementById(`pumpkin`).style.width="25%"
                    document.getElementById(`size`).textContent="Carving"
                }
                if(weighPumpkin(weight)=="Giant"){
                    document.getElementById(`pumpkin`).style.display="flex"
                    document.getElementById(`pumpkin`).style.width="50%"
                    document.getElementById(`size`).textContent="Giant"
                }
                if(weighPumpkin(weight)=="Record Breaker!"){
                    document.getElementById(`pumpkin`).style.display="flex"
                    document.getElementById(`pumpkin`).style.width="75%"
                    document.getElementById(`size`).textContent="Record Breaker!"
                }
            })
        }
        const unitToggle = document.getElementById("unitToggle");
        unitToggle.addEventListener("change", function () {
            if (unitToggle.checked) {
                isInKilograms=true
            } else {
                isInKilograms=false
            }
            if(document.getElementById(`weightInput`).value==""){
                document.getElementById(`pumpkin`).style.display="none"
                document.getElementById(`size`).textContent=""
                return
            }
            weight=parseFloat(document.getElementById(`weightInput`).value)
            if(isInKilograms){
                weight=Decimal(weight).times(2.205)
            }
            if(weighPumpkin(weight)=="Mini"){
                document.getElementById(`pumpkin`).style.display="flex"
                document.getElementById(`pumpkin`).style.width="12%"
                document.getElementById(`size`).textContent="Mini"
            }
            if(weighPumpkin(weight)=="Carving"){
                document.getElementById(`pumpkin`).style.display="flex"
                document.getElementById(`pumpkin`).style.width="25%"
                document.getElementById(`size`).textContent="Carving"
            }
            if(weighPumpkin(weight)=="Giant"){
                document.getElementById(`pumpkin`).style.display="flex"
                document.getElementById(`pumpkin`).style.width="50%"
                document.getElementById(`size`).textContent="Giant"
            }
            if(weighPumpkin(weight)=="Record Breaker!"){
                document.getElementById(`pumpkin`).style.display="flex"
                document.getElementById(`pumpkin`).style.width="75%"
                document.getElementById(`size`).textContent="Record Breaker!"
            }
        })
    </script>
</body>

</html>
